# A&N Daily Cashflow Digest — configuration
# Edit this file to tune the daily 6am email. Reload happens automatically on next run.

email:
  recipient: alex@anoutdoorservices.com
  subject_prefix: "A&N Daily Cashflow"
  send_hour_ct: 6      # 24h local time. Scheduler is timezone-aware.

# QuickBooks Online — bank + credit card balances.
# mode: 'manual' uses the values below (good while production API is gated).
# mode: 'api'    pulls live from QBO every run.
qbo:
  mode: api
  api:
    # Hide accounts from the cashflow view (personal cards mixed into QBO, etc.).
    # Find IDs by visiting /qbo/test and copying the "id" field of an account.
    excluded_account_ids: []
    # Examples (uncomment + edit to filter personal cards out):
    # excluded_account_ids:
    #   - "91"    # 2713 Alex Bootz Chase Business Unlimited CC
    #   - "1150040024"  # Capital One Spark 2% Alex

    # Override the QBO API balance for specific accounts. The Accounting API only
    # returns the 'posted' (in-QB) balance, which lags the real bank balance shown
    # in the QBO UI. Use this to pin the real bank balance for any account where
    # the gap matters. Account ID maps to the same id field surfaced in /qbo/test.
    #
    # Values are in "human" sign convention: positive for Bank cash on hand,
    # positive for CC debt. Update as_of when you refresh the number.
    balance_overrides: {}
    # Example:
    # balance_overrides:
    #   "48":            # Capital One Credit card
    #     balance: 12601.48
    #     as_of: "2026-05-14"
    #     note: "Real bank balance per QBO UI"
    #   "89":            # 6540 Niko Chase Business Cash Card
    #     balance: 49.78
    #     as_of: "2026-05-14"
  manual:
    as_of: null         # set to today's ISO date when you update the numbers
    cash_accounts:      # bank accounts: positive numbers = cash you have
      - {name: "Chase Operating", balance: 0.00}
      - {name: "Chase Savings",   balance: 0.00}
    cc_accounts:        # credit cards: positive numbers = debt owed
      - {name: "Co CC (Chase Ink Business)", balance: 0.00}

# Vendor accounts where A&N has a charge tab (not on credit card).
# v1: manual_balance is used. Update the number when you get it from the vendor.
# v2: flip auto: true once foremen reliably enter expenses in Jobber with the
# vendor name in the description. Then balance = sum of matching Jobber expenses MTD.
vendors:
  - name: "Lurvey's"
    parse_patterns: ["lurvey"]
    auto: false
    manual_balance: null
    manual_balance_as_of: null
  - name: "Des Plaines Material"
    parse_patterns: ["des plaines"]
    auto: false
    manual_balance: null
    manual_balance_as_of: null
  - name: "Patriot Materials"
    parse_patterns: ["patriot"]
    auto: false
    manual_balance: null
    manual_balance_as_of: null

# Recurring overhead spreadsheet (the one with rent, insurance, subscriptions etc.)
# Expects column headers: Monthly Expense, Amount, Account, Billing Date, Notes, Category, Fixed/Variable
overhead:
  sheet_id_env: FINANCIAL_OVERHEAD_SHEET_ID   # set this in .env
  tab_name: "Monthly Expenses"                # change if your tab is named differently

# Payroll accrual
# Work week: Monday through Sunday. Paid out the following Thursday.
# Wages are pulled from Jobber User.hourlyRate. Use overrides if Jobber rate is missing or wrong.
payroll:
  rate_overrides: {}      # e.g. "Erick Gonzalez": 22.00

# AR aging buckets. "Current" = not yet past due (days past due <= 0).
ar:
  aging_buckets:
    - {label: "Current", days_min: -99999, days_max: 0}
    - {label: "1-30",    days_min: 1,      days_max: 30}
    - {label: "31-60",   days_min: 31,     days_max: 60}
    - {label: "61-90",   days_min: 61,     days_max: 90}
    - {label: "90+",     days_min: 91,     days_max: 99999}

# Anomaly flags. v2 will compare today's snapshot to yesterday's saved state.
anomalies:
  cash_drop_pct_alert: 25     # flag if cash on hand drops >25% day-over-day
  new_overdue_alert: true     # flag any new invoice that crossed into 1-30 today

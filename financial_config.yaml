# A&N Daily Cashflow Digest — configuration
# Edit this file to tune the daily 6am email. Reload happens automatically on next run.

email:
  recipients:
    - alex@anoutdoorservices.com
  subject_prefix: "A&N Daily Cashflow"
  send_hour_ct: 6      # 24h local time. Scheduler is timezone-aware.

# Traffic-light thresholds for the daily cash email, applied to the month-end
# cushion (free cash left after this month's bills + money coming in).
cash_status:
  green_min: 10000     # >= this = green (comfortable)
  yellow_min: 0        # >= this = yellow (positive but tight); below = red

# Bank + credit card accounts. Balances come from this list and (optionally)
# from the "Balance Overrides" Google Sheet tab; Sheet entries (id-keyed) win.
# type: "Bank" = cash on hand (positive number = money you have)
# type: "Credit Card" = debt owed (positive number = money you owe)
qbo:
  accounts:
    # Liquid cash
    - {id: "38",  name: "Chase Checking (6906)", type: "Bank", balance: 52383.00, as_of: "2026-06-09"}
    - {id: "jobber_proc", name: "Jobber Processing (in-flight)", type: "Bank", balance: 10487.00, as_of: "2026-06-09"}
    - {id: "94",  name: "0607 Axos Savings", type: "Bank", balance: 8086.00, as_of: "2026-06-09"}
    - {id: "petty_cash", name: "Petty Cash on Hand", type: "Bank", balance: 1400.00, as_of: "2026-06-09"}
    # Credit cards
    # NOTE: per-card breakdown is stale. Total below is the only authoritative
    # number for now. Once Alex sends per-card values we restore the detailed list.
    - {id: "cc_aggregate", name: "Credit Cards (aggregate — needs per-card refresh)", type: "Credit Card", balance: 19354.00, as_of: "2026-06-09"}

# CC rewards available — offsets CC debt economically. Shown as a memo line
# under liquid assets, not added to cash itself.
cc_rewards:
  available: 4000.00
  as_of: "2026-06-09"
  note: "Approximate aggregate across cards"

# Vendor accounts where A&N has a charge tab (not on credit card).
# "auto: true" means: start from manual_balance as of manual_balance_as_of,
# then ADD all Jobber Expenses tagged with the vendor (matched by parse_patterns)
# dated strictly after the as_of date.
vendors:
  - name: "Lurvey's"
    parse_patterns: ["lurvey"]
    auto: true
    manual_balance: 7281.00
    manual_balance_as_of: "2026-06-09"
    due_date: "2026-07-01"
  - name: "Des Plaines Material"
    parse_patterns: ["des plaines"]
    auto: true
    manual_balance: 2110.00
    manual_balance_as_of: "2026-06-09"
    due_date: "2026-07-01"
  - name: "Patriot Materials"
    parse_patterns: ["patriot"]
    auto: true
    manual_balance: 200.00
    manual_balance_as_of: "2026-06-09"
    due_date: "2026-07-01"
  - name: "Brock (subcontractor)"
    parse_patterns: ["brock"]
    auto: false      # one-off vendor; no Jobber tagging convention
    manual_balance: 1850.00
    manual_balance_as_of: "2026-06-09"
    due_date: "2026-07-01"

# Customer deposits held — money collected from clients before service is
# performed. Sitting in our bank but a liability until earned. Subtract from
# net position. Show as a separate "restricted" line in the email.
customer_deposits:
  - {client: "Inke",      amount: 18904.00, as_of: "2026-06-09"}
  - {client: "Talukder",  amount: 3600.00,  as_of: "2026-06-09"}

# Uncleared checks: checks written but not yet hit the bank. The bank balance
# above still reflects the pre-check amount; this subtracts.
uncleared_checks:
  amount: 2000.00
  as_of: "2026-06-09"

# Owner pay owed to A&N owners (separate from crew payroll). Treat as a
# near-term cash obligation.
owner_pay:
  amount: 10000.00
  as_of: "2026-06-09"
  note: "Niko + Alex"


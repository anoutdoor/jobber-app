# type: "Credit Card" = debt owed (positive number = money you owe)
#
# Update workflow: open the job-costing Google Sheet -> "Balance Overrides"
# tab -> update Balance + As Of for the accounts that moved. No deploy
# needed. The id column there maps to the id field below.

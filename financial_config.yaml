# Variable overhead reference (NOT subtracted from position; informational).
# Used to compute breakeven target and surface in the email's reference block.
variable_overhead:
  fuel:           4510.00
  salaries:
    Niko:         5000.00
    Alex:         5000.00
    Arturo:       6000.00
    Traci:        4000.00
  maintenance:    1600.00
  physical_marketing: 5000.00
  other:          170.00
  monthly_breakeven_target: 131621.40   # fixed + variable + margin

# Payroll accrual
# Work week: Monday through Sunday. Paid out the following Thursday.
# labourRate per entry comes from Jobber. Use rate_overrides if a user's rate
# is missing or wrong on the Jobber side.
payroll:
  rate_overrides: {}      # e.g. "Erick Gonzalez": 22.00
  tax_burden_pct: 10
  # Names excluded from the payroll-owed accrual (owners + anyone paid outside
  # regular crew payroll). Matched on first name, case-insensitive.
  exclude_names: [Arturo, Alex, Niko, Brock]
  # OPTIONAL manual override. Normally LEAVE BLANK: the accrual window resets
  # automatically every Thursday (crew is paid each Wednesday for the prior
  # Mon-Sun week). Only set this (to the Sunday you actually paid through) if
  # you pay off-cycle or ahead; it is honored only when MORE recent than the
  # automatic reset, so a stale value never over-counts.
  last_payroll_paid_through: ""

# Mow P&L model (used by /mow-dashboard). Edit rates here; the dashboard reloads
# on its next refresh. Both crew members are on every mow, so direct labor =
# mow hours x (sum of crew_rates) x (1 + labor_burden_pct/100). Overhead spreads
# the crew's daily rate across that day's mows, proportional to each mow's time.
mow_costing:
  crew_rates:            # $/hour, both on every mow
    Gonzalo: 28
    Jonathan: 23
  labor_burden_pct: 15   # payroll taxes etc. on mow wages (separate from payroll accrual's 10%)
  crew_daily_overhead: 252   # Gonzalo crew's allocated overhead per working day
  overhead_method: by_mow_time   # by_mow_time | even_per_stop | flat_hourly

# AR aging buckets. "Current" = not yet past due (days past due <= 0).
ar:
  aging_buckets:
    - {label: "Current", days_min: -99999, days_max: 0}
    - {label: "1-30",    days_min: 1,      days_max: 30}
    - {label: "31-60",   days_min: 31,     days_max: 60}
    - {label: "61-90",   days_min: 61,     days_max: 90}
    - {label: "90+",     days_min: 91,     days_max: 99999}

# Anomaly flags.
anomalies:
  cash_drop_pct_alert: 25     # flag if cash on hand drops >25% day-over-day
  new_overdue_alert: true

# Bucket window for "due soon" sections in the email.
# The email surfaces obligations grouped into two windows:
#   1. "Due this week"  — through the next Sunday from snapshot date
#   2. "Due by July 1"  — through 2026-07-01 (vendor AP due date for everyone)
# Free-cash-after-bucket numbers are shown for each.
buckets:
  due_by_july_1: "2026-07-01"
